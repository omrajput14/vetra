<!-- Reusable Error State -->
<div class="flex flex-col items-center justify-center p-8 text-center gap-3">
  <span class="material-symbols-outlined text-[48px] text-alert-critical">error</span>
  <h3 class="font-card-title text-on-surface">Something went wrong</h3>
  <p class="font-caption-metadata text-text-metadata text-sm max-w-xs">Unable to load data. Please check your internet connection.</p>
  <button onclick="location.reload()" class="mt-2 px-4 py-2 bg-primary text-on-primary rounded-lg text-sm font-button-label">Retry</button>
</div>
