<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f7fce9;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-container":"#548dfe","tertiary-container":"#fcb4ff","on-tertiary-fixed-variant":"#692f70","error":"#ba1a1a","error-container":"#ffdad6","outline":"#717a64","text-metadata":"#737373","surface-dim":"#d7dcca","surface-tint":"#3f6900","on-tertiary":"#ffffff","background":"#f7fce9","on-tertiary-container":"#7b3f81","on-error":"#ffffff","inverse-primary":"#8fdb29","primary-fixed":"#a9f847","caution-amber":"#F2994A","on-primary-fixed-variant":"#2e4f00","on-surface":"#181d12","tertiary-fixed":"#ffd6fd","surface-variant":"#e0e5d2","surface-container-lowest":"#ffffff","alert-critical":"#C62828","surface":"#f7fce9","primary-fixed-dim":"#8fdb29","text-secondary":"#4e4d4c","tertiary":"#84478a","on-background":"#181d12","surface-container-low":"#f1f6e3","primary":"#3f6900","on-primary-fixed":"#102000","on-primary-container":"#396000","surface-container-highest":"#e0e5d2","on-secondary-fixed":"#001944","text-primary":"#141414","primary-container":"#94e130","secondary-fixed-dim":"#afc6ff","on-secondary-fixed-variant":"#004299","on-error-container":"#93000a","inverse-surface":"#2d3226","surface-card":"#ffffff","surface-background":"#f4eee5","surface-container":"#ebf0dd","secondary":"#0159c7","on-secondary-container":"#002760","tertiary-fixed-dim":"#f6aef9","surface-bright":"#f7fce9","on-primary":"#ffffff","surface-container-high":"#e5ead8","border-hairline":"#a1a1a1","outline-variant":"#c1cab0","on-tertiary-fixed":"#36003f","secondary-fixed":"#d9e2ff","inverse-on-surface":"#eef3e0","on-surface-variant":"#414a36","on-secondary":"#ffffff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"element-gap":"8px","touch-target-min":"52px","stack-gap":"16px","edge-margin":"20px"},"fontFamily":{"screen-title":["Lexend"],"caption-metadata":["Inter"],"body-default":["Lexend"],"alert-text":["Lexend"],"vet-data-row":["Inter"],"card-title":["Lexend"],"section-heading":["Lexend"],"button-label":["Lexend"]},"fontSize":{"screen-title":["24px",{"lineHeight":"32px","fontWeight":"600"}],"caption-metadata":["13px",{"lineHeight":"16px","fontWeight":"400"}],"body-default":["16px",{"lineHeight":"24px","fontWeight":"400"}],"alert-text":["16px",{"lineHeight":"20px","fontWeight":"600"}],"vet-data-row":["15px",{"lineHeight":"20px","fontWeight":"400"}],"card-title":["18px",{"lineHeight":"24px","fontWeight":"600"}],"section-heading":["20px",{"lineHeight":"28px","fontWeight":"600"}],"button-label":["16px",{"lineHeight":"20px","fontWeight":"600"}]}}}}</script><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface-background pt-safe pb-safe min-h-screen"><main class="w-full pb-6"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<!-- Ambient Background Element -->
<div class="absolute -top-32 -right-32 w-96 h-96 bg-primary-fixed rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<div class="flex flex-col w-full px-edge-margin pt-12 pb-8 flex-grow z-10">
<!-- Header Section -->
<div class="flex flex-col gap-element-gap mb-8">
<h1 class="font-screen-title text-screen-title text-text-primary">Forgot Password</h1>
<p class="font-body-default text-body-default text-text-secondary pr-4">
                Enter your registered email address or phone number to receive a reset link.
            </p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-stack-gap flex-grow">
<!-- Input Field -->
<div class="flex flex-col gap-2 relative">
<label class="font-caption-metadata text-caption-metadata text-text-secondary ml-1" for="reset-input">Email or Phone Number</label>
<div class="relative w-full h-touch-target-min bg-surface-card rounded border-hairline border-outline-variant flex items-center px-4 overflow-hidden focus-within:border-primary transition-colors duration-200 shadow-sm">
<span class="material-symbols-outlined text-text-metadata mr-3">mail</span>
<input class="w-full h-full bg-transparent font-body-default text-body-default text-text-primary placeholder-text-secondary focus:outline-none" id="reset-input" placeholder="e.g. user@farm.com or 555-0199" type="text"/>
</div>
</div>
<!-- Validation/Feedback Area (Hidden by default, used for interaction) -->
<div class="hidden flex items-center gap-2 p-3 rounded bg-surface-container-low text-text-primary font-caption-metadata opacity-0 transition-opacity duration-300" id="feedback-message">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>Link sent! Check your inbox.</span>
</div>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-element-gap mt-auto pt-8">
<button class="w-full h-touch-target-min bg-primary rounded shadow-md flex items-center justify-center gap-2 active:scale-[0.98] transition-transform duration-150 relative overflow-hidden group" id="send-btn">
<span class="font-button-label text-button-label text-on-primary relative z-10">Send Reset Link</span>
<span class="material-symbols-outlined text-on-primary relative z-10 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
<!-- Ripple effect container -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-active:opacity-100 transition-opacity"></div>
</button>
<button class="w-full h-touch-target-min bg-transparent border-hairline border-outline-variant rounded flex items-center justify-center mt-2 active:scale-[0.98] transition-transform duration-150">
<span class="font-button-label text-button-label text-text-primary">Back to Login</span>
</button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('send-btn');
            const input = document.getElementById('reset-input');
            const feedback = document.getElementById('feedback-message');
            
            if(sendBtn && input && feedback) {
                sendBtn.addEventListener('click', () => {
                    if(input.value.trim() !== '') {
                        // Simulate sending
                        const originalText = sendBtn.innerHTML;
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-on-primary animate-spin">progress_activity</span>`;
                        sendBtn.classList.add('opacity-80', 'pointer-events-none');
                        
                        setTimeout(() => {
                            sendBtn.innerHTML = originalText;
                            sendBtn.classList.remove('opacity-80', 'pointer-events-none');
                            input.value = '';
                            
                            feedback.classList.remove('hidden');
                            // Slight delay to allow display:block to apply before opacity transition
                            requestAnimationFrame(() => {
                                feedback.classList.remove('opacity-0');
                                feedback.classList.add('opacity-100');
                            });
                            
                            setTimeout(() => {
                                feedback.classList.remove('opacity-100');
                                feedback.classList.add('opacity-0');
                                setTimeout(() => feedback.classList.add('hidden'), 300);
                            }, 3000);
                        }, 1500);
                    } else {
                        // Shake animation for empty input
                        input.parentElement.classList.add('animate-[shake_0.4s_ease-in-out]');
                        input.parentElement.classList.replace('border-outline-variant', 'border-error');
                        setTimeout(() => {
                            input.parentElement.classList.remove('animate-[shake_0.4s_ease-in-out]');
                            input.parentElement.classList.replace('border-error', 'border-outline-variant');
                        }, 400);
                    }
                });
            }
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</div></main>

</body></html>
