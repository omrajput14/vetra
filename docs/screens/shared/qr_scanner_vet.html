  </head><body class="bg-background text-on-surface font-body-default text-body-default min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 flex items-center justify-between px-edge-margin"><h1 class="font-screen-title text-screen-title text-on-surface tracking-tight truncate mr-4">Vet Requests</h1><div class="flex items-center gap-4"><button class="flex items-center justify-center w-10 h-10"><span class="material-symbols-outlined text-on-surface-variant">notifications</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 pt-14 pb-32 bg-background pb-6"><div class="flex flex-col w-full h-full relative bg-inverse-surface">

<video autoplay="" class="w-full h-full object-cover opacity-80" id="camera-stream" muted="" playsinline=""></video>
<div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
</div>
<div class="relative z-10 flex flex-col h-[calc(100vh-120px)] justify-between px-edge-margin pt-stack-gap pb-[80px]">
<div class="flex justify-between items-center w-full">
<h2 class="font-screen-title text-screen-title text-on-error px-4 py-2 rounded-full bg-on-background/50 backdrop-blur-sm border-hairline border-outline-variant/30 shadow-sm">Scan Animal QR</h2>
<button class="w-touch-target-min h-touch-target-min rounded-full bg-on-background/50 backdrop-blur-sm border-hairline border-outline-variant/30 shadow-sm flex items-center justify-center transition-colors active:bg-primary/80" id="flash-toggle">
<span class="material-symbols-outlined text-on-error text-[28px]" id="flash-icon">flash_off</span>
</button>
</div>
<div class="flex-1 flex flex-col items-center justify-center relative">
<div class="relative w-64 h-64">
<div class="absolute inset-0 border-[3px] border-surface-card/20 rounded-xl"></div>
<div class="absolute top-0 left-0 w-8 h-8 border-t-[4px] border-l-[4px] border-primary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-[4px] border-r-[4px] border-primary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-[4px] border-l-[4px] border-primary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-[4px] border-r-[4px] border-primary rounded-br-xl"></div>
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary shadow-[0_0_8px_2px_rgba(143,219,41,0.5)] animate-[scan_2s_ease-in-out_infinite]"></div>
</div>
</div>
<div class="w-full bg-surface-card/90 backdrop-blur-md rounded-xl p-stack-gap border-hairline border-outline-variant shadow-lg flex items-center gap-element-gap">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container">qr_code_scanner</span>
</div>
<p class="font-body-default text-body-default text-text-primary">Align animal QR code within frame to view medical history</p>
</div>
</div>
</div>
<style>
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(256px); opacity: 0; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const flashBtn = document.getElementById('flash-toggle');
    const flashIcon = document.getElementById('flash-icon');
    let flashOn = false;

    flashBtn.addEventListener('click', () => {
      flashOn = !flashOn;
      if (flashOn) {
        flashIcon.textContent = 'flash_on';
        flashIcon.classList.remove('text-on-error');
        flashIcon.classList.add('text-primary-fixed');
      } else {
        flashIcon.textContent = 'flash_off';
        flashIcon.classList.remove('text-primary-fixed');
        flashIcon.classList.add('text-on-error');
      }
    });
    
    // Simulate camera feed setup (visual only for mockup)
    const video = document.getElementById('camera-stream');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(err) {
                console.log("Camera access denied or not available. Using simulated background.");
                // Fallback handled by CSS
            });
    }
  });
</script></main>
