</div>
</label>
<label class="filter-chip-label cursor-pointer group">
<input class="peer hidden" type="checkbox" value="sheep"/>
<div class="h-12 px-5 flex items-center justify-center gap-2 rounded-full border border-border-hairline bg-surface peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container text-on-surface transition-all shadow-sm">

<div class="h-12 px-5 flex items-center justify-center gap-2 rounded-full border border-border-hairline bg-surface peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container text-on-surface transition-all shadow-sm">
<span class="material-symbols-outlined text-[20px] opacity-70 group-hover:opacity-100">savings</span>

</div>

<div class="h-px w-full bg-border-hairline/30 rounded-full"></div>
<section class="flex flex-col gap-4">

<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 p-3 rounded-xl border border-border-hairline/50 hover:bg-surface-container-low transition-colors cursor-pointer bg-surface-card shadow-sm">
<div class="relative flex items-center justify-center w-6 h-6 rounded-full border-2 border-outline-variant bg-surface">

<div class="relative flex items-center justify-center w-6 h-6 rounded-full border-2 border-outline-variant bg-surface">
<input checked="" class="peer absolute opacity-0 w-full h-full cursor-pointer" type="checkbox" value="treatment"/>
<span class="material-symbols-outlined text-[16px] text-caution-amber opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<div class="relative flex items-center justify-center w-6 h-6 rounded-full border-2 border-outline-variant bg-surface">
<input class="peer absolute opacity-0 w-full h-full cursor-pointer" type="checkbox" value="quarantine"/>
<span class="material-symbols-outlined text-[16px] text-alert-critical opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-body-default text-body-default text-on-surface flex-1">Quarantined</span>
<span class="w-2 h-2 rounded-full bg-alert-critical shadow-[0_0_8px_rgba(198,40,40,0.4)]"></span>
</label>

<label class="cursor-pointer">
<input checked="" class="peer hidden" name="timeframe" type="radio" value="7days"/>
<div class="h-[52px] rounded-lg border border-border-hairline bg-surface peer-checked:bg-secondary-container peer-checked:border-secondary peer-checked:text-on-secondary-container text-on-surface flex items-center justify-center font-button-label text-button-label transition-all shadow-sm">
             Last 7 Days
           </div>
</label>

<input class="peer hidden" name="timeframe" type="radio" value="30days"/>
<div class="h-[52px] rounded-lg border border-border-hairline bg-surface peer-checked:bg-secondary-container peer-checked:border-secondary peer-checked:text-on-secondary-container text-on-surface flex items-center justify-center font-button-label text-button-label transition-all shadow-sm">
             Last 30 Days
           </div>
</label>
</div>

<div class="fixed bottom-0 left-0 w-full p-edge-margin bg-gradient-to-t from-surface-background via-surface-background to-transparent pb-[env(safe-area-inset-bottom,20px)] pt-12 z-20 pointer-events-none">
<button class="w-full h-[52px] bg-primary rounded-lg flex items-center justify-center gap-2 font-button-label text-button-label text-on-primary shadow-lg hover:bg-surface-tint active:scale-[0.98] transition-all pointer-events-auto relative overflow-hidden" id="apply-filters-btn">
<span class="relative z-10">Apply Filters</span>
<span class="material-symbols-outlined relative z-10 text-[20px]">check</span>
<div class="absolute inset-0 bg-white/20 translate-y-full rounded-lg transition-transform" id="btn-highlight"></div>
</button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const applyBtn = document.getElementById('apply-filters-btn');
    const resetBtn = document.getElementById('reset-filters-btn');
    const allCheckboxes = document.querySelectorAll('input[type="checkbox"]');
    const allRadios = document.querySelectorAll('input[type="radio"]');

    // Simple interaction feedback for apply button
    applyBtn.addEventListener('mousedown', () => {
        const highlight = applyBtn.querySelector('#btn-highlight');
        if(highlight) highlight.classList.remove('translate-y-full');
    });
    applyBtn.addEventListener('mouseup', () => {
        const highlight = applyBtn.querySelector('#btn-highlight');
        if(highlight) {
            setTimeout(() => { highlight.classList.add('translate-y-full'); }, 200);
        }
        
        // Simulate applying
        applyBtn.querySelector('span:first-child').textContent = "Updating View...";
        applyBtn.querySelector('span.material-symbols-outlined').textContent = "sync";
        applyBtn.querySelector('span.material-symbols-outlined').classList.add('animate-spin');
        
        setTimeout(() => {
             applyBtn.querySelector('span:first-child').textContent = "Apply Filters";
             applyBtn.querySelector('span.material-symbols-outlined').textContent = "check";
             applyBtn.querySelector('span.material-symbols-outlined').classList.remove('animate-spin');
        }, 800);
    });

    // Reset functionality
    resetBtn.addEventListener('click', () => {
       allCheckboxes.forEach(cb => cb.checked = false);
       allRadios.forEach(radio => {
           if(radio.value === '7days') radio.checked = true;
       });
       
       // Visual feedback for reset
       resetBtn.style.transform = 'scale(0.95)';
       setTimeout(() => resetBtn.style.transform = 'scale(1)', 150);
    });
  });
</script></main>
