  </head><body class="bg-background font-body-default text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-edge-margin flex items-center justify-between"><div class="flex items-center gap-element-gap"><span class="material-symbols-outlined text-primary text-[28px]">health_and_safety</span><span class="font-screen-title text-screen-title tracking-tight text-primary">VETRA</span></div><div class="flex items-center gap-4"><h1 class="hidden md:block font-section-heading text-section-heading">Livestock Registry</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="pt-16 pb-6 bg-background min-h-screen"><div class="flex flex-col w-full px-edge-margin gap-stack-gap">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-[24px]">add_circle</span>
<h2 class="font-section-heading text-section-heading text-on-surface">Add New Animal</h2>
</div>
<div class="bg-surface-card rounded-xl p-4 flex flex-col gap-stack-gap relative overflow-hidden">
<div class="absolute top-0 right-0 w-24 h-24 bg-primary/5 rounded-bl-full pointer-events-none"></div>
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Animal Name</label>
<input class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg px-4 font-body-default text-body-default placeholder:text-text-secondary outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2 transition-shadow" placeholder="e.g., Bessie" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Species</label>
<div class="relative">
<select class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg px-4 appearance-none font-body-default text-body-default outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2">
<option disabled="" selected="" value="">Select Species</option>
<option value="cattle">Cattle</option>
<option value="poultry">Poultry</option>
<option value="sheep">Sheep</option>
<option value="swine">Swine</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Breed</label>
<input class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg px-4 font-body-default text-body-default placeholder:text-text-secondary outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2" placeholder="e.g., Holstein" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Tag ID</label>
<div class="relative">
<input class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg pl-4 pr-12 font-body-default text-body-default placeholder:text-text-secondary outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2" placeholder="Scan or enter" type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-primary rounded-md hover:bg-surface-container-highest active:bg-surface-dim transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
</button>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Age (Months)</label>
<input class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg px-4 font-body-default text-body-default placeholder:text-text-secondary outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2" placeholder="0" type="number"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-on-surface">Weight (kg)</label>
<input class="h-touch-target-min w-full bg-surface-container-lowest text-on-surface rounded-lg px-4 font-body-default text-body-default placeholder:text-text-secondary outline outline-1 outline-border-hairline focus:outline-primary focus:outline-2" placeholder="0.0" step="0.1" type="number"/>
</div>
</div>
</div>
<div class="bg-surface-card rounded-xl p-4 flex flex-col gap-3">

<span class="material-symbols-outlined text-[32px] text-text-secondary">add_a_photo</span>

<input accept="image/*" class="hidden" id="photo-upload" type="file"/>
</div>
</div>
<div class="flex flex-col gap-3 mt-4">
<button class="h-touch-target-min w-full bg-primary text-on-primary font-button-label text-button-label rounded-lg flex items-center justify-center gap-2 shadow-sm active:bg-on-primary-fixed-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">check</span>
      Add Animal
    </button>
<button class="h-touch-target-min w-full bg-transparent text-primary font-button-label text-button-label rounded-lg flex items-center justify-center outline outline-1 outline-border-hairline active:bg-surface-container-highest transition-colors">
      Cancel
    </button>
</div>
</div></main>
