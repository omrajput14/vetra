</div>
<div class="ml-auto">

          Active
        </span>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-gap mt-2" onsubmit="event.preventDefault(); showSuccessState();">
<!-- Medicine Selection -->
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-text-primary" for="medicine">Medicine</label>
<div class="relative">
<input class="w-full h-13 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg px-4 font-body-default text-body-default text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent pr-12" id="medicine" placeholder="Search medication..." type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none">search</span>
</div>
</div>
<!-- Dosage & Frequency Row -->
<div class="flex gap-4 w-full">
<div class="flex flex-col gap-2 flex-1 min-w-0">
<label class="font-button-label text-button-label text-text-primary truncate" for="dosage">Dosage</label>
<input class="w-full h-13 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg px-4 font-body-default text-body-default text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="dosage" placeholder="e.g. 50ml" type="text"/>
</div>
<div class="flex flex-col gap-2 flex-1 min-w-0">
<label class="font-button-label text-button-label text-text-primary truncate" for="frequency">Frequency</label>
<select class="w-full h-13 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg px-4 font-body-default text-body-default text-text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent appearance-none bg-no-repeat bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cpath%20d%3D%22M7%2010L12%2015L17%2010%22%20stroke%3D%22%234e4d4c%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E')] bg-[position:right_12px_center]" id="frequency">
<option value="1">Once Daily</option>
<option value="2">Twice Daily</option>
<option value="3">Every 8 Hours</option>
<option value="4">As Needed</option>
</select>
</div>
</div>
<!-- Duration -->
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-text-primary" for="duration">Duration (Days)</label>
<div class="flex items-center">
<button class="w-13 h-13 min-w-[52px] min-h-[52px] flex items-center justify-center border border-border-hairline rounded-l-lg bg-surface-card text-text-primary active:bg-surface-variant transition-colors" onclick="adjustDuration(-1)" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 h-13 min-h-[52px] border-y border-border-hairline bg-surface-card text-center font-body-default text-body-default text-text-primary focus:outline-none focus:ring-inset focus:ring-2 focus:ring-primary" id="duration" min="1" type="number" value="7"/>
<button class="w-13 h-13 min-w-[52px] min-h-[52px] flex items-center justify-center border border-border-hairline rounded-r-lg bg-surface-card text-text-primary active:bg-surface-variant transition-colors" onclick="adjustDuration(1)" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>

<!-- Notes -->
<div class="flex flex-col gap-2">
<label class="font-button-label text-button-label text-text-primary" for="notes">Additional Instructions</label>

<!-- Digital Signature Area -->
<div class="flex flex-col gap-2 mt-4">

</div>

<!-- Success Overlay (Hidden by default) -->

<div class="w-24 h-24 rounded-full bg-primary-container flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<button class="w-full h-13 min-h-[52px] bg-primary text-on-primary font-button-label text-button-label rounded-lg flex items-center justify-center" onclick="resetForm()" type="button">
        Return to Patient Profile
      </button>
</div>
</div>
<!-- Bottom Navigation (4-tab Vet Nav) -->

</div>
<script>
  // Duration stepper logic
  function adjustDuration(amount) {
    const input = document.getElementById('duration');
    let val = parseInt(input.value) || 0;
    val += amount;
    if (val < 1) val = 1;
    input.value = val;
  }

  // Simple signature pad logic
  const canvas = document.getElementById('signature-pad');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('signature-container');
  const placeholder = document.getElementById('signature-placeholder');
  
  let isDrawing = false;
  let hasSignature = false;

  function resizeCanvas() {
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
    ctx.strokeStyle = '#141414'; // text-primary
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  window.addEventListener('resize', resizeCanvas);
  // Need slight delay to ensure container has rendered dimensions
  setTimeout(resizeCanvas, 100);

  function startPosition(e) {
    isDrawing = true;
    hasSignature = true;
    placeholder.style.display = 'none';
    draw(e);
  }

  function endPosition() {
    isDrawing = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!isDrawing) return;
    
    e.preventDefault(); // Prevent scrolling on touch
    
    let clientX, clientY;
    if (e.type.includes('touch')) {
      const rect = canvas.getBoundingClientRect();
      clientX = e.touches[0].clientX - rect.left;
      clientY = e.touches[0].clientY - rect.top;
    } else {
      clientX = e.offsetX;
      clientY = e.offsetY;
    }

    ctx.lineTo(clientX, clientY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clientX, clientY);
  }

  // Mouse events
  canvas.addEventListener('mousedown', startPosition);
  canvas.addEventListener('mouseup', endPosition);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseleave', endPosition);

  // Touch events
  canvas.addEventListener('touchstart', startPosition, {passive: false});
  canvas.addEventListener('touchend', endPosition);
  canvas.addEventListener('touchmove', draw, {passive: false});

  function clearSignature() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSignature = false;
    placeholder.style.display = 'flex';
  }

  // Success state handling
  function showSuccessState() {
    if(!hasSignature) {
        // Subtle visual shake if not signed (pseudo-validation for demo)
        container.classList.add('border-alert-critical');
        setTimeout(() => container.classList.remove('border-alert-critical'), 500);
        return;
    }
    
    const overlay = document.getElementById('success-overlay');
    overlay.classList.remove('hidden');
    // Trigger reflow
    void overlay.offsetWidth;
    overlay.classList.remove('opacity-0');
  }

  function resetForm() {
    const overlay = document.getElementById('success-overlay');
    overlay.classList.add('opacity-0');
    setTimeout(() => {
      overlay.classList.add('hidden');
      document.querySelector('form').reset();
      clearSignature();
      document.getElementById('duration').value = 7;
    }, 300);
  }
</script></main>
