<script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnGetStarted = document.getElementById('btn-get-started');
      const ripple = document.getElementById('btn-ripple');
      const card = document.getElementById('onboarding-card');

      // Subtle entry animation for the card
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      
      requestAnimationFrame(() => {
        setTimeout(() => {
          card.style.transition = 'opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, 100);
      });

      // Button interaction effect
      btnGetStarted.addEventListener('click', () => {
        ripple.style.transition = 'none';
        ripple.style.transform = 'translateX(-100%)';
        
        // Force reflow
        void ripple.offsetWidth;
        
        ripple.style.transition = 'transform 0.6s ease-out';
        ripple.style.transform = 'translateX(100%)';
      });
    });
  </script>
