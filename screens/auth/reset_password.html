<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f7fce9;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-container":"#548dfe","tertiary-container":"#fcb4ff","on-tertiary-fixed-variant":"#692f70","error":"#ba1a1a","error-container":"#ffdad6","outline":"#717a64","text-metadata":"#737373","surface-dim":"#d7dcca","surface-tint":"#3f6900","on-tertiary":"#ffffff","background":"#f7fce9","on-tertiary-container":"#7b3f81","on-error":"#ffffff","inverse-primary":"#8fdb29","primary-fixed":"#a9f847","caution-amber":"#F2994A","on-primary-fixed-variant":"#2e4f00","on-surface":"#181d12","tertiary-fixed":"#ffd6fd","surface-variant":"#e0e5d2","surface-container-lowest":"#ffffff","alert-critical":"#C62828","surface":"#f7fce9","primary-fixed-dim":"#8fdb29","text-secondary":"#4e4d4c","tertiary":"#84478a","on-background":"#181d12","surface-container-low":"#f1f6e3","primary":"#3f6900","on-primary-fixed":"#102000","on-primary-container":"#396000","surface-container-highest":"#e0e5d2","on-secondary-fixed":"#001944","text-primary":"#141414","primary-container":"#94e130","secondary-fixed-dim":"#afc6ff","on-secondary-fixed-variant":"#004299","on-error-container":"#93000a","inverse-surface":"#2d3226","surface-card":"#ffffff","surface-background":"#f4eee5","surface-container":"#ebf0dd","secondary":"#0159c7","on-secondary-container":"#002760","tertiary-fixed-dim":"#f6aef9","surface-bright":"#f7fce9","on-primary":"#ffffff","surface-container-high":"#e5ead8","border-hairline":"#a1a1a1","outline-variant":"#c1cab0","on-tertiary-fixed":"#36003f","secondary-f   </head><body class="bg-surface-background pt-safe pb-safe min-h-screen"><main class="w-full pb-6"><div class="flex flex-col w-full h-full relative" id="reset-password-container">
<div class="px-5 pt-8 pb-4">
<h1 class="font-screen-title text-screen-title text-text-primary mb-2">Reset Password</h1>
<p class="font-body-default text-body-default text-text-secondary">Create a new secure password for your account.</p>
</div>
<div class="px-5 flex flex-col gap-stack-gap mt-4">
<!-- New Password Input -->
<div class="relative w-full">
<input aria-label="New Password" class="w-full h-[52px] px-4 rounded-DEFAULT bg-surface-card border border-border-hairline font-body-default text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent pr-12 transition-all duration-200" id="new-password" placeholder="New Password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-[52px] w-[52px] flex items-center justify-center text-text-metadata hover:text-text-primary transition-colors" id="toggle-new-pwd" type="button">
<span class="material-symbols-outlined" id="icon-new-pwd">visibility_off</span>
</button>
</div>
<!-- Confirm Password Input -->
<div class="relative w-full">
<input aria-label="Confirm New Password" class="w-full h-[52px] px-4 rounded-DEFAULT bg-surface-card border border-border-hairline font-body-default text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent pr-12 transition-all duration-200" id="confirm-password" placeholder="Confirm New Password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-[52px] w-[52px] flex items-center justify-center text-text-metadata hover:text-text-primary transition-colors" id="toggle-confirm-pwd" type="button">
<span class="material-symbols-outlined" id="icon-confirm-pwd">visibility_off</span>
</button>
</div>
<!-- Password Requirements -->
<div class="bg-surface-container-low p-4 rounded-lg border border-border-hairline mt-2">
<h3 class="font-card-title text-[14px] font-semibold text-text-primary mb-3">Password Requirements</h3>
<ul class="flex flex-col gap-2">
<li class="flex items-center gap-2 font-caption-metadata text-text-secondary" id="req-length">
<span class="material-symbols-outlined text-[18px] text-text-metadata transition-colors duration-300" id="icon-req-length">radio_button_unchecked</span>
          At least 8 characters
        </li>
<li class="flex items-center gap-2 font-caption-metadata text-text-secondary" id="req-number">
<span class="material-symbols-outlined text-[18px] text-text-metadata transition-colors duration-300" id="icon-req-number">radio_button_unchecked</span>
          Contains at least 1 number
        </li>
<li class="flex items-center gap-2 font-caption-metadata text-text-secondary" id="req-match">
<span class="material-symbols-outlined text-[18px] text-text-metadata transition-colors duration-300" id="icon-req-match">radio_button_unchecked</span>
          Passwords match
        </li>
</ul>
</div>
</div>
<div class="px-5 mt-auto pb-8 pt-12">
<button class="w-full h-[52px] bg-primary text-on-primary font-button-label text-button-label rounded-DEFAULT flex items-center justify-center transition-all duration-300 disabled:opacity-50 disabled:bg-surface-variant disabled:text-text-metadata active:scale-[0.98]" disabled="" id="update-btn">
      Update Password
    </button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const newPwdInput = document.getElementById('new-password');
      const confirmPwdInput = document.getElementById('confirm-password');
      const toggleNewBtn = document.getElementById('toggle-new-pwd');
      const toggleConfirmBtn = document.getElementById('toggle-confirm-pwd');
      const iconNew = document.getElementById('icon-new-pwd');
      const iconConfirm = document.getElementById('icon-confirm-pwd');
      const updateBtn = document.getElementById('update-btn');

      const reqLength = document.getElementById('req-length');
      const reqNumber = document.getElementById('req-number');
      const reqMatch = document.getElementById('req-match');
      const iconReqLength = document.getElementById('icon-req-length');
      const iconReqNumber = document.getElementById('icon-req-number');
      const iconReqMatch = document.getElementById('icon-req-match');

      // Toggle Visibility
      const setupToggle = (btn, input, icon) => {
        btn.addEventListener('click', () => {
          if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
          } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
          }
          input.focus();
        });
      };

      setupToggle(toggleNewBtn, newPwdInput, iconNew);
      setupToggle(toggleConfirmBtn, confirmPwdInput, iconConfirm);

      // Validation Logic
      const validate = () => {
        const p1 = newPwdInput.value;
        const p2 = confirmPwdInput.value;

        let hasLength = p1.length >= 8;
        let hasNum = /\d/.test(p1);
        let isMatch = p1 === p2 && p1.length > 0;

        const updateReqUI = (isValid, el, icon) => {
          if (isValid) {
            el.classList.replace('text-text-secondary', 'text-primary');
            icon.textContent = 'check_circle';
            icon.classList.replace('text-text-metadata', 'text-primary');
            icon.style.fontVariationSettings = "'FILL' 1";
          } else {
            el.classList.replace('text-primary', 'text-text-secondary');
            icon.textContent = 'radio_button_unchecked';
            icon.classList.replace('text-primary', 'text-text-metadata');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        };

        updateReqUI(hasLength, reqLength, iconReqLength);
        updateReqUI(hasNum, reqNumber, iconReqNumber);
        updateReqUI(isMatch, reqMatch, iconReqMatch);

        if (hasLength && hasNum && isMatch) {
          updateBtn.removeAttribute('disabled');
          updateBtn.classList.remove('disabled:opacity-50', 'disabled:bg-surface-variant', 'disabled:text-text-metadata');
        } else {
          updateBtn.setAttribute('disabled', 'true');
          updateBtn.classList.add('disabled:opacity-50', 'disabled:bg-surface-variant', 'disabled:text-text-metadata');
        }
      };

      newPwdInput.addEventListener('input', validate);
      confirmPwdInput.addEventListener('input', validate);
      
      // Success interaction
      updateBtn.addEventListener('click', () => {
        const originalText = updateBtn.textContent;
        updateBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="animation: spin 1s linear infinite;">progress_activity</span>';
        
        setTimeout(() => {
          updateBtn.innerHTML = '<span class="material-symbols-outlined mr-2" style="font-variation-settings: \'FILL\' 1;">check_circle</span> Password Updated';
          updateBtn.classList.add('bg-inverse-primary', 'text-on-primary-fixed-variant');
          updateBtn.classList.remove('bg-primary', 'text-on-primary');
        }, 1500);
      });
    });
  </script>
<style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</div></main>

</body></html>
