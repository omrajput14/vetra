<script>
  // Simple script to cycle status opacity for a mock loading feel
  document.addEventListener('DOMContentLoaded', () => {
    const items = document.querySelectorAll('.status-item');
    let currentActive = 1;

    setInterval(() => {
        if(currentActive === 1) {
            items[1].classList.remove('opacity-100');
            items[1].classList.add('opacity-50');
            items[1].querySelector('.w-5').innerHTML = '<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: \'FILL\' 1;">check</span>';
            items[1].querySelector('.w-5').classList.replace('bg-surface', 'bg-surface-card');
            
            items[2].classList.remove('opacity-50');
            items[2].classList.add('opacity-100');
            items[2].querySelector('.w-5').innerHTML = '<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>';
            items[2].querySelector('.w-5').classList.replace('border-border-hairline', 'border-primary');
            currentActive = 2;
        } else if (currentActive === 2) {
             // reset mock
             items[1].classList.remove('opacity-50');
             items[1].classList.add('opacity-100');
             items[1].querySelector('.w-5').innerHTML = '<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>';
             
             items[2].classList.remove('opacity-100');
             items[2].classList.add('opacity-50');
             items[2].querySelector('.w-5').innerHTML = '';
             items[2].querySelector('.w-5').classList.replace('border-primary', 'border-border-hairline');
             currentActive = 1;
        }
    }, 3500);
  });
