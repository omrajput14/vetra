  </head><body class="bg-surface-background font-body-default text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface-background/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-edge-margin flex items-center justify-between"><div class="flex items-center gap-element-gap"><img alt="Vetra App Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBed1iD3yCiLY23a8v-BZChBJIYpZhX3TyLD-xUZ30yBieFVpcVciNFgxoXT3WJ46jxgX8VvGDBcbDZg9ZccMryoIyv8snvidk7BK5m69d5ycCTgHC2vWlukX6C4lkBAMIrt30lKEZXz_-1Dy3DQ6kiASsf1y951FID37F6JHiPCD-9mVqiOjmDzHGnis4lOUbB65LgOwQlO-CZABy68n4CGjYrPyeKgt_zsx9qF-cU5GpdfPGqBL8vqKiJmCQvSfy35FnJcrVPN6DP"/><span class="font-screen-title text-lg">Vet Cases</span></div><div class="flex items-center gap-3"><div class="px-3 py-1 bg-secondary text-white rounded-full text-[10px] font-bold uppercase tracking-widest">VET ROLE</div><div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center"><span class="material-symbols-outlined text-white text-[18px]">stethoscope</span></div></div></div></header><main class="pt-16 pb-6 min-h-screen px-edge-margin"><div class="flex flex-col w-full pb-6">
<!-- Header/Photo Section -->
<div class="relative w-full h-48 sm:h-64 mb-6">
<div class="absolute inset-0 bg-surface-container-high">
<img class="w-full h-full object-cover" data-alt="Close up portrait photo of a healthy Holstein Friesian cow named Bessie on a bright sunny day in a green pasture. The focus is sharp on her face with shallow depth of field blurring the background. Warm natural lighting, high contrast modern rural aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuACFsavoZY5BnDe9KtGGEC42sK3THs3rx8DnkCtqxo2DKrUgEWI_Y0rgHVwZ-ti_Boi9FUZOAynWTFly9_8WeU79H1nDGu6IwG-KyiL_KVQnZOWvV4V8-n0p8r2HJchyLOksUKSjsgEAW1D5fZ-lmsMgsZlFQQarPjEcvR6yOeLEHNl3tY9Xtclsci9fEdtcl4nYwEPInjBHa7CsVst_xc9_KqfTTF55mfWbsm5XrVkXCtcRovR7Z65JqvdxnhIeIHGbVw9BgkRjck8"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
</div>
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
<div>
<h1 class="font-screen-title text-white text-2xl drop-shadow-md">Edit Profile</h1>
<p class="font-caption-metadata text-white/90">NL-93842 • Cattle</p>
</div>
<!-- Floating Action Button for Photo Edit -->
<button aria-label="Change photo" class="w-12 h-12 rounded-full bg-surface-card border border-border-hairline shadow-md flex items-center justify-center text-text-primary active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</button>
</div>
</div>
<!-- Form Section -->
<div class="px-edge-margin space-y-stack-gap">
<!-- Basic Info Card -->
<div class="bg-surface-card rounded-xl p-4 shadow-sm border border-border-hairline">
<h2 class="font-section-heading text-text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-surface-tint">info</span>
                Basic Details
            </h2>
<div class="space-y-4">
<!-- Input: Animal Name -->
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="animal-name">Animal Name / Identifier</label>
<input class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-4 font-body-default text-text-primary focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full" id="animal-name" type="text" value="Bessie"/>
</div>
<!-- Input Group: Species & Breed -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="species">Species</label>
<div class="relative">
<select class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-4 pr-10 font-body-default text-text-primary appearance-none focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full" id="species">
<option selected="" value="cattle">Cattle</option>
<option value="sheep">Sheep</option>
<option value="goat">Goat</option>
<option value="horse">Horse</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="breed">Breed</label>
<input class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-4 font-body-default text-text-primary focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full" id="breed" type="text" value="Holstein Friesian"/>
</div>
</div>
</div>
</div>
<!-- Identification & Stats Card -->
<div class="bg-surface-card rounded-xl p-4 shadow-sm border border-border-hairline">
<h2 class="font-section-heading text-text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-surface-tint">fingerprint</span>
                Identification &amp; Stats
            </h2>
<div class="space-y-4">
<!-- Input: Tag ID -->
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="tag-id">Official Tag ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none">qr_code_scanner</span>
<input class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg pl-10 pr-4 font-body-default text-text-primary focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full font-mono uppercase" id="tag-id" type="text" value="NL-93842"/>
</div>
</div>
<!-- Input Group: Age & Weight -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="age">Est. Age</label>
<div class="flex gap-2">
<input class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-3 font-body-default text-text-primary focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full text-center" id="age" type="number" value="4"/>
<div class="relative w-full">
<select class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-3 pr-8 font-body-default text-text-primary appearance-none focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full" id="age-unit">
<option selected="" value="years">Yrs</option>
<option value="months">Mos</option>
<option value="weeks">Wks</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-caption-metadata text-text-secondary pl-1" for="weight">Weight</label>
<div class="flex gap-2">
<input class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-3 font-body-default text-text-primary focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full text-center" id="weight" type="text" value="1,450"/>
<div class="relative w-full">
<select class="h-[52px] bg-surface-container-lowest border border-border-hairline rounded-lg px-3 pr-8 font-body-default text-text-primary appearance-none focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint w-full" id="weight-unit">
<option selected="" value="lbs">lbs</option>
<option value="kg">kg</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Status Toggles -->
<div class="bg-surface-card rounded-xl p-4 shadow-sm border border-border-hairline">
<h2 class="font-section-heading text-text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-surface-tint">health_and_safety</span>
                Health Status Flags
            </h2>
<div class="flex flex-col gap-3">
<label class="flex items-center justify-between p-3 border border-border-hairline rounded-lg bg-surface-container-low active:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-caution-amber">warning</span>
<span class="font-body-default text-text-primary">Requires Attention</span>
</div>
<div class="relative inline-block w-12 h-6 rounded-full bg-border-hairline/30 transition-colors duration-200 ease-in-out cursor-pointer toggle-switch" data-state="off">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out toggle-knob"></div>
<input aria-label="Toggle Requires Attention" class="sr-only" type="checkbox"/>
</div>
</label>
<label class="flex items-center justify-between p-3 border border-border-hairline rounded-lg bg-surface-container-low active:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-surface-tint">vaccines</span>
<span class="font-body-default text-text-primary">Vaccinations Up to Date</span>
</div>
<div class="relative inline-block w-12 h-6 rounded-full bg-surface-tint transition-colors duration-200 ease-in-out cursor-pointer toggle-switch" data-state="on">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out translate-x-6 toggle-knob"></div>
<input aria-label="Toggle Vaccinations Up to Date" checked="" class="sr-only" type="checkbox"/>
</div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-8 flex flex-col gap-3 pt-4">
<button class="w-full h-[52px] rounded-lg bg-primary-container text-on-primary-container font-button-label text-center flex items-center justify-center gap-2 active:opacity-80 transition-opacity shadow-sm" id="save-btn">
<span class="material-symbols-outlined text-[20px]">save</span>
                Save Changes
            </button>
<button class="w-full h-[52px] rounded-lg bg-transparent border border-border-hairline text-text-primary font-button-label text-center flex items-center justify-center active:bg-surface-container transition-colors" id="cancel-btn">
                Cancel
            </button>
</div>
<!-- Danger Zone -->
<div class="mt-8 border-t border-border-hairline pt-6 flex justify-center">
<button class="flex items-center gap-2 text-alert-critical font-button-label py-2 px-4 rounded-lg active:bg-error-container/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
                 Remove Animal Record
             </button>
</div>
</div>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-surface-card border border-primary-container text-on-surface px-6 py-3 rounded-full shadow-lg flex items-center gap-3 font-body-default transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50" id="toast-success">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Changes saved successfully
    </div>
</div>
<script>
    // Toggle switch logic
    document.querySelectorAll('.toggle-switch').forEach(switchEl => {
        switchEl.addEventListener('click', (e) => {
            // Prevent default label behavior if wrapped in label
            e.preventDefault(); 
            
            const input = switchEl.querySelector('input');
            const knob = switchEl.querySelector('.toggle-knob');
            const currentState = switchEl.getAttribute('data-state');
            
            if (currentState === 'off') {
                switchEl.setAttribute('data-state', 'on');
                switchEl.classList.remove('bg-border-hairline/30');
                switchEl.classList.add('bg-surface-tint');
                knob.classList.add('translate-x-6');
                input.checked = true;
            } else {
                switchEl.setAttribute('data-state', 'off');
                switchEl.classList.remove('bg-surface-tint');
                switchEl.classList.add('bg-border-hairline/30');
                knob.classList.remove('translate-x-6');
                input.checked = false;
            }
        });
    });

    // Save button interaction
    const saveBtn = document.getElementById('save-btn');
    const toast = document.getElementById('toast-success');
    
    saveBtn.addEventListener('click', () => {
        // Simple loading state
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
        saveBtn.classList.add('opacity-80', 'pointer-events-none');
        
        setTimeout(() => {
            saveBtn.innerHTML = originalContent;
            saveBtn.classList.remove('opacity-80', 'pointer-events-none');
            
            // Show toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
            
        }, 800);
    });
</script></main>

</body></html>
