g": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "touch-target-min": "52px", "edge-margin": "20px", "stack-gap": "16px", "element-gap": "8px" }, "fontFamily": { "section-heading": ["Lexend"], "screen-title": ["Lexend"], "vet-data-row": ["Inter"], "button-label": ["Lexend"], "body-default": ["Lexend"], "alert-text": ["Lexend"], "card-title": ["Lexend"], "caption-metadata": ["Inter"] } } } }</script><style>@layer base { body { background-color: #f4eee5; overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style><style>

  </head><body class="bg-surface-background text-on-surface font-body-default min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface-background/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center justify-between px-edge-margin"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[20px]">agriculture</span></div><span class="font-screen-title text-screen-title tracking-tight text-primary">VETRA</span></div><div class="flex items-center gap-4"><h2 class="hidden md:block font-screen-title text-body-default text-text-secondary">Profile</h2><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="relative w-full pt-16 bg-surface-background min-h-screen pb-[100px] pb-6"><div class="flex flex-col w-full h-full">
<!-- Header Area -->
<div class="px-edge-margin pb-stack-gap border-b border-border-hairline">
<h1 class="font-screen-title text-screen-title text-primary tracking-tight">Language Settings</h1>
<p class="font-body-default text-body-default text-text-secondary mt-1">Select your preferred app language.</p>
</div>
<!-- Language Options List -->
<div class="flex-1 px-edge-margin py-stack-gap flex flex-col gap-element-gap">
<!-- English (Selected) -->
<label class="relative flex items-center justify-between p-4 min-h-[52px] bg-surface-card border border-primary rounded-lg shadow-sm cursor-pointer transition-colors hover:bg-surface-container-lowest">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">language</span>
<span class="font-card-title text-card-title text-primary">English</span>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full border-2 border-primary bg-surface-card">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
<input checked="" class="hidden" name="app_language" type="radio" value="en"/>
</label>
<!-- Hindi -->
<label class="relative flex items-center justify-between p-4 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg shadow-sm cursor-pointer transition-colors hover:bg-surface-container-low">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary">translate</span>
<div class="flex flex-col">
<span class="font-card-title text-card-title text-text-primary">Hindi (हिन्दी)</span>
</div>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full border-2 border-border-hairline bg-surface-card">
<!-- Unselected empty circle -->
</div>
<input class="hidden" name="app_language" type="radio" value="hi"/>
</label>
<!-- Marathi -->
<label class="relative flex items-center justify-between p-4 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg shadow-sm cursor-pointer transition-colors hover:bg-surface-container-low">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary">translate</span>
<div class="flex flex-col">
<span class="font-card-title text-card-title text-text-primary">Marathi (मराठी)</span>
</div>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full border-2 border-border-hairline bg-surface-card">
</div>
<input class="hidden" name="app_language" type="radio" value="mr"/>
</label>
<!-- Telugu -->
<label class="relative flex items-center justify-between p-4 min-h-[52px] bg-surface-card border border-border-hairline rounded-lg shadow-sm cursor-pointer transition-colors hover:bg-surface-container-low">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary">translate</span>
<div class="flex flex-col">
<span class="font-card-title text-card-title text-text-primary">Telugu (తెలుగు)</span>
</div>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full border-2 border-border-hairline bg-surface-card">
</div>
<input class="hidden" name="app_language" type="radio" value="te"/>
</label>
</div>
<!-- Sticky Bottom Action -->
<div class="sticky bottom-0 px-edge-margin py-stack-gap bg-surface-background/90 backdrop-blur-md border-t border-border-hairline mt-auto">
<button class="w-full min-h-[52px] bg-primary text-on-primary font-button-label text-button-label rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">save</span>
            Save Changes
        </button>
</div>
</div>
<script>
    // Simple script to handle radio button visual state changes
    document.addEventListener('DOMContentLoaded', () => {
        const labels = document.querySelectorAll('label:has(input[type="radio"])');
        
        labels.forEach(label => {
            const input = label.querySelector('input');
            
            input.addEventListener('change', () => {
                // Reset all labels
                labels.forEach(l => {
                    l.classList.remove('border-primary');
                    l.classList.add('border-border-hairline');
                    const icon = l.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-text-secondary');
                    icon.style.fontVariationSettings = "'FILL' 0";
                    
                    const text = l.querySelector('.font-card-title');
                    text.classList.remove('text-primary');
                    text.classList.add('text-text-primary');

                    const circle = l.querySelector('.w-6');
                    circle.classList.remove('border-primary');
                    circle.classList.add('border-border-hairline');
                    circle.innerHTML = ''; // Remove inner dot
                });

                // Set active label
                if (input.checked) {
                    label.classList.remove('border-border-hairline');
                    label.classList.add('border-primary');
                    
                    const icon = label.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-text-secondary');
                    icon.classList.add('text-primary');
                    icon.style.fontVariationSettings = "'FILL' 1";
                    
                    const text = label.querySelector('.font-card-title');
                    text.classList.remove('text-text-primary');
                    text.classList.add('text-primary');

                    const circle = label.querySelector('.w-6');
                    circle.classList.remove('border-border-hairline');
                    circle.classList.add('border-primary');
                    circle.innerHTML = '<div class="w-3 h-3 rounded-full bg-primary"></div>';
                }
            });
        });
    });
</script></main>

</body></html>
