services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: vetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-vetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetra} -d ${POSTGRES_DB:-vetra_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vetra-network

  # ── Vetra Backend ────────────────────────────────────────────────────
  vetra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetra-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vetra_dev}
      DB_USERNAME: ${POSTGRES_USER:-vetra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vetra-network

volumes:
  postgres_data:
    driver: local

networks:
  vetra-network:
    driver: bridge
