name: vetra
description: Production Flutter app for Vetra Livestock Health Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.20.2
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  flutter_native_splash: ^2.4.1
  geolocator: ^14.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Offline-first / local database
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/vetra_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/vetra_adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/vetra_adaptive_foreground.png"

flutter_native_splash:
  color: "#FAF8F5"
  image: assets/branding/vetra_logo.png
  android_12:
    image: assets/branding/vetra_adaptive_foreground.png
    color: "#FAF8F5"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/branding/
